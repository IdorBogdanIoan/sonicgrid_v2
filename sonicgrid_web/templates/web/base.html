<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}SonicGrid{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#5d6670;--line:#dfe3e8;--accent:#0b6bcb;--accent-fg:#fff;--err:#b42318;--err-bg:#fef3f2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--fg:#e6e9ed;--muted:#9aa4af;--line:#2a3039;--accent:#4a9eff;--accent-fg:#0b1220;--err:#ff8a80;--err-bg:#2a1414}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{border-bottom:1px solid var(--line);background:var(--card)}
.bar{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;letter-spacing:.2px;text-decoration:none;color:var(--fg);display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.bar nav{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px}
.bar nav a{color:var(--muted);text-decoration:none}.bar nav a:hover{color:var(--fg)}
main{max-width:980px;margin:0 auto;padding:32px 16px}
.doc{max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:32px}
.doc h1{margin-top:0;font-size:26px}.doc h2{font-size:18px;margin-top:28px}
.meta{color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .bar{flex-wrap:wrap}
footer a{color:var(--muted)}
button,.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.link{background:none;color:var(--muted);padding:0;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
@media (max-width:600px){.doc{padding:20px}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2M21 12h0"/></svg>SonicGrid</a>
  <nav>
    {% if current_user %}
      <span>{{ current_user }}</span>
      <form method="post" action="{{ url_for('web.logout') }}" style="margin:0">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="link" type="submit">Deconectare</button>
      </form>
    {% endif %}
  </nav>
</div></header>
<main>{% block content %}{% endblock %}</main>
<footer><div class="bar">
  <span>© 2026 {{ legal.project }} · {{ legal.operator }}</span>
  <nav>
    <a href="{{ url_for('web.terms') }}">Termeni</a>
    <a href="{{ url_for('web.privacy') }}">Confidențialitate</a>
    <a href="{{ url_for('web.about') }}">Despre</a>
  </nav>
</div></footer>
</body>
</html>
